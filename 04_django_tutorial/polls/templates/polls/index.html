{% if lastest_questions %}
    <ul>
        {% for question in lastest_questions %}

            <li><a href="{% url 'polls:detail' question.id %}">{{ question.question_text }}</a></li>

        {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif%}

{% if numbers%}
    <p>numbers</p>
    {% for x in numbers%}
        <p> {{x}}</p>
    {% endfor %}

{% endif %}
